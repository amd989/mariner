<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mariner 2 probe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#c89520"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40e8d0"/>
      <stop offset="100%" stop-color="#2a9a8a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#0f1e35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="5" cy="5" r="0.6" fill="#40e8d0" opacity="0.8"/>
  <circle cx="27" cy="7" r="0.5" fill="#f0c040" opacity="0.7"/>
  <circle cx="4" cy="22" r="0.4" fill="#fff" opacity="0.5"/>
  <circle cx="28" cy="26" r="0.35" fill="#fff" opacity="0.4"/>
  <circle cx="8" cy="28" r="0.3" fill="#40e8d0" opacity="0.35"/>

  <!-- Antenna mast -->
  <line x1="16" y1="4.5" x2="16" y2="10" stroke="url(#teal)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Dish - parabolic arc -->
  <path d="M11 6.5 Q16 2.5 21 6.5" fill="none" stroke="url(#teal)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Signal waves from dish -->
  <path d="M13.5 4 Q16 1.5 18.5 4" fill="none" stroke="#40e8d0" stroke-width="0.4" opacity="0.4" stroke-linecap="round"/>

  <!-- Spacecraft bus - hexagonal -->
  <polygon points="16,10 19.5,12 19.5,17 16,19 12.5,17 12.5,12" fill="url(#gold)" stroke="#c89520" stroke-width="0.3"/>

  <!-- Bus detail - center eye -->
  <circle cx="16" cy="14.5" r="1.5" fill="#0d1527" stroke="#40e8d0" stroke-width="0.4"/>
  <circle cx="16" cy="14.5" r="0.5" fill="#40e8d0" opacity="0.9"/>

  <!-- Solar panel - left -->
  <rect x="3" y="11.5" width="8.5" height="4.5" rx="0.6" fill="url(#panel)" stroke="#40e8d0" stroke-width="0.4"/>
  <!-- Panel grid lines - left -->
  <line x1="5.8" y1="11.5" x2="5.8" y2="16" stroke="#40e8d0" stroke-width="0.2" opacity="0.35"/>
  <line x1="8.6" y1="11.5" x2="8.6" y2="16" stroke="#40e8d0" stroke-width="0.2" opacity="0.35"/>
  <line x1="3" y1="13.75" x2="11.5" y2="13.75" stroke="#40e8d0" stroke-width="0.2" opacity="0.35"/>

  <!-- Solar panel - right -->
  <rect x="20.5" y="11.5" width="8.5" height="4.5" rx="0.6" fill="url(#panel)" stroke="#40e8d0" stroke-width="0.4"/>
  <!-- Panel grid lines - right -->
  <line x1="23.3" y1="11.5" x2="23.3" y2="16" stroke="#40e8d0" stroke-width="0.2" opacity="0.35"/>
  <line x1="26.1" y1="11.5" x2="26.1" y2="16" stroke="#40e8d0" stroke-width="0.2" opacity="0.35"/>
  <line x1="20.5" y1="13.75" x2="29" y2="13.75" stroke="#40e8d0" stroke-width="0.2" opacity="0.35"/>

  <!-- Panel struts -->
  <line x1="11.5" y1="13.75" x2="12.5" y2="13.75" stroke="#c89520" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="19.5" y1="13.75" x2="20.5" y2="13.75" stroke="#c89520" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Thruster nozzle -->
  <polygon points="14.5,19 17.5,19 18.2,22 13.8,22" fill="#1a3050" stroke="#40e8d0" stroke-width="0.3"/>

  <!-- Thrust glow -->
  <path d="M14.5 22 Q16 27 17.5 22" fill="none" stroke="#f0c040" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <path d="M15 22 Q16 25.5 17 22" fill="none" stroke="#f0c040" stroke-width="0.4" opacity="0.35" stroke-linecap="round"/>
</svg>
